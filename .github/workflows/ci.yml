name: pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # seeds -> models -> 40 tests, including the reconciliation to the CRM control totals
      - run: dbt build --profiles-dir .
      - run: python ml/win_probability.py
      - run: python scripts/export_outputs.py
      - run: dbt docs generate --profiles-dir .
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: target/
